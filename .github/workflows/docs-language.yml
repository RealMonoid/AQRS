name: M2-E19 authorized Ubuntu replay

on:
  push:
    branches: [codex/m2-e19-ubuntu-replay]

permissions:
  contents: read

jobs:
  market-replay:
    if: github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TZ: America/New_York
    steps:
      - name: Check out the reviewed comparison source
        uses: actions/checkout@v5
        with:
          ref: ff862a631bb5429044828013add41da7a313a202
          path: frozen
      - name: Check out the replay admission and Windows result
        uses: actions/checkout@v5
        with:
          path: replay-input
          persist-credentials: false
          sparse-checkout: evidence/m2-e19-replay
      - name: Check out only the existing M2-E18 market archive bundle
        uses: actions/checkout@v5
        with:
          ref: 1eebbfa372724291cccd702120a558885bc41cc1
          path: market-input
          persist-credentials: false
          sparse-checkout: evidence/m2-e18-replay/acceptance.zip
          sparse-checkout-cone-mode: false
      - name: Set up Windows-matched Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.12'
      - name: Install the frozen package and matching numerical dependencies
        working-directory: frozen
        run: >-
          python -m pip install -e .
          numpy==2.5.4 scipy==1.18.1 scikit-learn==1.9.1 hmmlearn==0.3.3
      - name: Run coverage before the non-root market comparison
        working-directory: frozen
        run: |
          python -c "import os, platform; from datetime import datetime; assert os.geteuid() != 0; print(platform.platform(), platform.machine(), platform.python_version(), datetime.now().astimezone().utcoffset())"
          python -B -m aqrs.m2_e19 --archives ../market-input/evidence/m2-e18-replay/acceptance.zip --output artifacts/m2-e19/ubuntu-coverage
          python -c "import json, math; from pathlib import Path; a, b = (json.loads(Path(p).read_bytes()) for p in ('evidence/m2-e19-coverage.json', 'artifacts/m2-e19/ubuntu-coverage/coverage.json')); assert a['decision'] == b['decision'] == 'QUALIFIED'; assert b['outcome']['result']['estimator_fits'] == 0; assert all(x['days'] == y['days'] and x['eligible'] == y['eligible'] and math.isclose(x['cutoff'], y['cutoff'], rel_tol=1e-12) for x, y in zip(a['outcome']['result']['folds'], b['outcome']['result']['folds'], strict=True))"
          python -B -m aqrs.m2_e19 --archives ../market-input/evidence/m2-e18-replay/acceptance.zip --admission ../replay-input/evidence/m2-e19-replay/admission.json --windows-report ../replay-input/evidence/m2-e19-replay/windows.json --output artifacts/m2-e19/ubuntu
      - name: Preserve replay receipts and journals
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m2-e19-ubuntu-evidence
          path: |
            frozen/artifacts/m2-e19/ubuntu-coverage/coverage.json
            frozen/artifacts/m2-e19/ubuntu-coverage/research.sqlite3
            frozen/artifacts/m2-e19/ubuntu/report.json
            frozen/artifacts/m2-e19/ubuntu/research.sqlite3
