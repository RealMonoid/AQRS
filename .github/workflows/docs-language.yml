name: M2-E18 authorized Ubuntu replay

on:
  push:
    branches: [codex/m2-e18-ubuntu-replay]

permissions:
  contents: read

jobs:
  market-replay:
    if: github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TZ: America/New_York
    steps:
      - name: Check out the frozen and reviewed M2-E18 revision
        uses: actions/checkout@v5
        with:
          ref: 54fb8644b5a27c51fece7d89f3d9996a65356ad2
          path: frozen
      - name: Check out the registered inputs and Windows receipt
        uses: actions/checkout@v5
        with:
          path: replay-input
          persist-credentials: false
      - name: Set up the Windows-matched Python version
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.12'
      - name: Install the frozen package and matching numerical dependencies
        working-directory: frozen
        run: >-
          python -m pip install -e .
          numpy==2.5.4 scipy==1.18.1 scikit-learn==1.9.1 PyYAML==6.0.3
          psutil==7.2.2 threadpoolctl==3.8.0 joblib==1.6.0
      - name: Run the authorized comparison under non-root Ubuntu
        working-directory: frozen
        run: |
          python -c "import os, platform; from datetime import datetime; assert os.geteuid() != 0; print(platform.platform(), platform.machine(), platform.python_version(), datetime.now().astimezone().utcoffset())"
          python -B -m aqrs.m2_e14 --campaign M2-E18 --market-root ../replay-input/evidence/m2-e18-replay/acceptance.zip --admission ../replay-input/evidence/m2-e18-replay/admission.json --windows-report ../replay-input/evidence/m2-e18-replay/windows.json --output artifacts/m2-e18/ubuntu
      - name: Preserve replay evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m2-e18-ubuntu-evidence
          path: |
            frozen/artifacts/m2-e18/ubuntu/report.json
            frozen/artifacts/m2-e18/ubuntu/report.md
            frozen/artifacts/m2-e18/ubuntu/research.sqlite3
            frozen/artifacts/m2-e18/ubuntu/source/
          if-no-files-found: warn
          retention-days: 30
